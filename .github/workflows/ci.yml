# ──────────────────────────────────────────────────────────────────────
# KRIA CI Pipeline — Runs on every push and pull request.
#
# Jobs:
#   1. rust-check   — cargo fmt, clippy, and workspace build
#   2. n8n-ci-safe — centralized n8n CI-safe subset
#   3. rust-test    — integration + feature tests (kria-core, kria-server)
#   4. ui-unit-test — Vitest unit/snapshot tests for UI
#   5. e2e-api      — Playwright API integration tests
#   6. e2e-browser  — Playwright browser E2E tests (requires UI build)
#
# NOTE: Jobs 3-6 are temporarily disabled for faster CI iteration.
#       Uncomment them when ready for full test suite.
# ──────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -W warnings

jobs:
  # ── Rust lint & build ────────────────────────────────────────────
  rust-check:
    name: "Rust — Check & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -W warnings

      - name: Build workspace
        run: cargo build --workspace

  # ── n8n CI-safe tests ───────────────────────────────────────────
  n8n-ci-safe:
    name: "n8n — CI-Safe Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libasound2-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key-prefix: n8n-ci-safe

      - name: Run n8n CI-safe subset
        run: ./testing/run.sh n8n --profile ci --fail-fast

      - name: Add n8n CI report to job summary
        if: always()
        shell: bash
        run: |
          report="$(ls -t testing/eval_reports/kria_testing_n8n_ci_*.md 2>/dev/null | head -n 1 || true)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No n8n CI markdown report found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload n8n CI reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-ci-safe-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            testing/eval_reports/kria_testing_n8n_ci_*.json
            testing/eval_reports/kria_testing_n8n_ci_*.md
            testing/eval_reports/n8n_phase0_contract_*.txt
            testing/eval_reports/n8n_runtime_modes_*.txt
            testing/eval_reports/n8n_phase2_ui_*.txt
            testing/eval_reports/n8n_phase3_progress_*.txt
            testing/eval_reports/n8n_phase4_management_*.txt
            testing/eval_reports/n8n_phase5_invocation_*.txt
            testing/eval_reports/n8n_stage3_routing_eval_*.txt
            testing/eval_reports/n8n_workflow_authoring_validation_*.txt

  # ── UI design tokens & token-lint gate ──────────────────────────
  # Enforces token purity (raw colors + undefined vars, Req 14.2), canonical
  # component ownership (Req 14.4), and design-system tests.
  ui-tokens:
    name: "UI — Design Tokens & Lint Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Regenerate design tokens
        working-directory: ui
        run: npm run tokens:build

      - name: Fail if generated tokens are out of date
        working-directory: ui
        run: |
          if ! git diff --quiet -- src/styles/tokens.generated.css; then
            echo "::error::src/styles/tokens.generated.css is stale — run 'npm run tokens:build' and commit the result."
            git --no-pager diff -- src/styles/tokens.generated.css
            exit 1
          fi

      - name: UI consistency lint (tokens + one component per concept)
        working-directory: ui
        run: npm run lint:ui-consistency

      - name: Run design-system unit tests
        working-directory: ui
        run: npm run test:run -- src/design-system

  # ─────────────────────────────────────────────────────────────────
