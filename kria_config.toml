# KRIA unified infra runtime controls
#
# This file centralizes SRE-sensitive constants used by the QoS scheduler,
# target pool leasing, and snapshot recovery guardrails.

[qos]
high_recovery_slo_ms = 500
retry_after_defer_ms = 50
max_latency_samples = 128
max_medium_credits = 32
medium_credit_per_high_completion = 1
monitor_sample_interval_ms = 100
max_adaptation_history = 512

[target_pool]
lease_ttl_ms = 10000
heartbeat_grace_ms = 1500
quarantine_cooldown_ms = 2000

[snapshot]
max_normalized_hash_distance = 0.12












[executive]
enabled = true
max_background_tasks = 2

[policy_gate]
enabled = true

[uncertainty]
enabled = true

[planner]
enabled = true
max_steps = 15
fallback_to_cloud = true

[self_model]
enabled = true

[skill_compiler]
enabled = true

[world_model]
enabled = true

[curiosity]
enabled = true
max_cpu_percent = 10

# ─── Phase 4.5 — Mobile prompt-control ───
[mobile]
enabled = true
require_device_auth = true
# Empty → uses [server].host (default 0.0.0.0 = LAN-reachable for testing).
# For production, install Tailscale and set this to the laptop's tailnet IP.
bind_interface = ""
token_ttl_secs = 86400
pairing_ttl_secs = 300

# ─── Phase 4.6 — Remote desktop view & takeover (portal ScreenCast + WebRTC) ───
[remote_desktop]
enabled = true
# Capture via xdg-desktop-portal ScreenCast + PipeWire (X11 + Wayland), streamed
# to the phone over WebRTC. No RDP / no gnome-remote-desktop — same live session.
idle_timeout_secs = 300
max_fps = 30
max_dimension = 1600
video_encoder = "vp8"

# ─── Phase 4.5.5 — ntfy push (optional) ───
[ntfy]
enabled = false
server_url = "https://ntfy.sh"
topic = ""
auth_token = ""
default_priority = "default"
