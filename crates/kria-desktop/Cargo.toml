[package]
name = "kria-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "K.R.I.A. Desktop — Tauri v2 native desktop application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kria-core = { path = "../kria-core" }
kria-connection-control = { path = "../kria-connection-control" }
kria-server = { path = "../kria-server" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
axum = { version = "0.8", features = ["json", "ws"] }
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
image = { workspace = true, features = ["png", "jpeg"] }

[features]
# LIVE OS control is ON by default: building or running the desktop app needs no
# extra flag for a prompt to reach the host.
#
# What still governs every action, with the feature on:
#   * risk policy and the execution gate (a RED action needs your approval),
#   * a durable audit admission before anything runs,
#   * write leases, so two actions cannot fight over the same resource,
#   * observe -> apply -> verify, with a receipt, and rollback where a real
#     inverse exists.
# The feature decides whether providers are COMPOSED, not whether they are
# governed. A domain whose backend is absent stays uncomposed and answers
# `Unavailable` rather than degrading to a shell.
#
# Mutually exclusive with kria-core/os-control-test by a hard compile_error!, so
# the deny-live test composition can never link a live transport. Test commands
# therefore pass `--no-default-features --features os-control-test`.
#
# To build the app WITHOUT any ability to touch the host:
#   cargo run -p kria-desktop --no-default-features
default = ["os-control-live"]
nvidia = ["kria-core/nvidia"]
os-control-live = ["kria-core/os-control-live"]
