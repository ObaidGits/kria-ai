[package]
name = "kria-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "K.R.I.A. Desktop — Tauri v2 native desktop application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kria-core = { path = "../kria-core" }
kria-connection-control = { path = "../kria-connection-control" }
kria-server = { path = "../kria-server" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
axum = { version = "0.8", features = ["json", "ws"] }
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
image = { workspace = true, features = ["png", "jpeg"] }

[features]
nvidia = ["kria-core/nvidia"]
