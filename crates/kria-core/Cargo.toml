[package]
name = "kria-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "K.R.I.A. — Kernel-Responsive Intelligent Agent (shared core library)"

[[bin]]
name = "test_gui_e2e"
path = "src/bin/test_gui_e2e.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
sysinfo = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
notify = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
arboard = { workspace = true }
notify-rust = { workspace = true }
cpal = { workspace = true }
rodio = { workspace = true }
ort = { workspace = true }
ndarray = { workspace = true }
tokenizers = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
scraper = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
config = { workspace = true }
schemars = "0.8"
which = "6"
open = { workspace = true }
url = { workspace = true }
unicode-normalization = { workspace = true }
tokio-util = { workspace = true }
bollard = "0.18"
tar = "0.4"
serde_yaml = "0.9"
zbus = { workspace = true, optional = true }
nvml-wrapper = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true }
urlencoding = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
memmap2 = { workspace = true }
zip = { workspace = true }
fastembed = { workspace = true }
llguidance = { workspace = true }
fjall = { workspace = true }
rmp-serde = { workspace = true }
governor = { workspace = true }
backoff = { workspace = true }
shlex = "1.3"
kria-connection-control = { path = "../kria-connection-control" }

# ─── Vision dependencies (Phase 2.5) ────────────────────────────────────────
# Note: image crate already in workspace dependencies
img_hash = "3.2"
xcap = "0.0.11"

# ML Orchestrator dependencies
tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }
xxhash-rust = { workspace = true }

# ─── Voice v2 native backends — STRICTLY OPTIONAL ─────────────────────────
# Each of these pulls in heavy native build deps (clang, cmake, vendored C).
# They MUST stay `optional = true` so the default `cargo build` remains
# pure-Rust. Activate via the per-engine feature flags below, or via the
# aggregate `native-audio` feature for a full v2 build.
whisper-rs = { version = "0.13", optional = true, default-features = false }
piper-rs = { version = "0.1.9", optional = true, default-features = false }
webrtc-audio-processing = { version = "0.5", optional = true }

[features]
nvidia = ["nvml-wrapper"]
# D-Bus perception layer (Linux only, optional)
dbus-perception = ["dep:zbus"]
# RFC v2: skeleton modules for the new GUI cognition stack (IntentCompiler,
# EnvironmentGrounder, ExecutionVerifier, SafetyTrustBoundary).
# Off by default — modules ship as trait definitions only until P1–P6 land.
gui_cognition_v2 = []
# ── Voice v2 native backends ──
# whisper-rs is now DEFAULT ON for in-process persistent STT with real partials.
# This eliminates the subprocess cold-start (1-3s) and enables Hinglish prompt.
# Requires: cmake, clang (for whisper.cpp C++ compilation via whisper-rs FFI).
voice-whisper-rs = ["dep:whisper-rs"]
voice-whisper-cuda = ["voice-whisper-rs", "whisper-rs?/cuda"]
voice-whisper-vulkan = ["voice-whisper-rs", "whisper-rs?/vulkan"]
# In-process piper runtime.
voice-piper-rs = ["dep:piper-rs"]
voice-aec = ["dep:webrtc-audio-processing"]
voice-wake-oww = []

# Default features: enable in-process whisper for realtime partials.
default = ["voice-whisper-rs"]

# Aggregate convenience flag: enable every native backend at once.
# Pulls in clang + cmake at build time. Use only when you want the full
# in-process v2 stack (no CLI shell-outs).
native-audio = [
    "voice-whisper-rs",
    "voice-piper-rs",
    "voice-aec",
    "voice-wake-oww",
]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Ring 4: Linux seccomp-bpf syscall filter
seccompiler = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
wiremock = "0.6"
