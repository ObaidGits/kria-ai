[package]
name = "kria-eval"
version = "0.1.0"
edition = "2021"

# Default eval harness binary (src/main.rs).
[[bin]]
name = "kria-eval"
path = "src/main.rs"

# CMD-MG-COVERAGE: read-only Memory Graph coverage/orphan gate (task F0.1).
[[bin]]
name = "mg-coverage"
path = "src/bin/mg_coverage.rs"

# mg-baseline: focused current-state baseline capture (task F0.5 / 0.5.2).
[[bin]]
name = "mg-baseline"
path = "src/bin/mg_baseline.rs"

# mg-f0-manifest: generate + sign the F0 gate manifest (task F0.5 / 0.5.4).
[[bin]]
name = "mg-f0-manifest"
path = "src/bin/mg_f0_manifest.rs"

# mg-eval: CMD-MG-EVAL — judged retrieval quality evaluation (task 3.9.7 / V-RET-03).
[[bin]]
name = "mg-eval"
path = "src/bin/mg_eval.rs"

# mg-release-materialize: task 5.1.1 — materialize, verify, and record the 100k mg-release-v2 fixture.
[[bin]]
name = "mg-release-materialize"
path = "src/bin/mg_release_materialize.rs"

# mg-correctness-100k: task 5.1.2 — exact correctness gate before performance sampling.
[[bin]]
name = "mg-correctness-100k"
path = "src/bin/mg_correctness_100k.rs"

# mg-query-plans: task 5.1.3 — EXPLAIN QUERY PLAN gate for hot SQL paths.
[[bin]]
name = "mg-query-plans"
path = "src/bin/mg_query_plans.rs"

# mg-perf-samples: task 5.1.5 — cold + ≥30 warm p50/p95/p99 + bootstrap CI.
[[bin]]
name = "mg-perf-samples"
path = "src/bin/mg_perf_samples.rs"

# mg-resource-trace: task 5.1.6 — V-RESOURCE-01 resource trace.
[[bin]]
name = "mg-resource-trace"
path = "src/bin/mg_resource_trace.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
dotenvy = "0.15"
reqwest = { workspace = true }
rusqlite = { workspace = true }
which = "6"
tokio-util = { workspace = true }
glob = "0.3"
async-trait = { workspace = true }
kria-core = { path = "../kria-core" }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
semver = "1.0.28"
toml = { workspace = true }
sha2 = { workspace = true }
