# OPT-IN: let the KRIA broker install and remove packages.
#
# ── Read this before installing it ───────────────────────────────────────────
#
# Installing a package runs the package's own maintainer scripts as root. Those
# scripts are arbitrary code, written by whoever built the package. No systemd
# confinement can bound them meaningfully: a package that needs to load a kernel
# module, mount a filesystem, or add a user must be allowed to, or the install
# breaks.
#
# So this drop-in does not pretend to confine that work. It turns the relevant
# protections off for the whole broker process, which is why it is NOT installed
# by default and why the base unit stays hardened without it.
#
# The alternative, and the better choice for most people: leave this out and let
# your desktop's own Software application install packages. KRIA can still search,
# inspect and plan package changes without it — only `apply_system_updates` needs
# this file.
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/kria-os-broker.service.d
#   sudo cp 10-packages.conf /etc/systemd/system/kria-os-broker.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart kria-os-broker
#
# Remove it again by deleting that file and restarting the service. Nothing else
# in KRIA changes.

[Service]
# Maintainer scripts write across the whole filesystem.
ProtectSystem=off
# Downloading packages needs real network access and IP address families.
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
# dpkg triggers, systemd units, users, and kernel modules are all fair game for a
# maintainer script.
CapabilityBoundingSet=~
AmbientCapabilities=
SystemCallFilter=
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectControlGroups=no
MemoryDenyWriteExecute=no
